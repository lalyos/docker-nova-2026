services:
  coffee:
    build: 
      tags:
      - lunch
      - lunch:dev
    environment:
    - MESSAGE=${MESSAGE:-welcome}
    - COLOR=${COLOR:-gray}
    ports:
    - 80
     
  mydb:
    image: postgres
    environment:
    - POSTGRES_PASSWORD=s3cr3t
    volumes:
    - vip:/var/lib/postgresql
    - ./sql:/docker-entrypoint-initdb.d

  adminer:
    image: adminer
    ports:
    - 8080

volumes:
  vip: 